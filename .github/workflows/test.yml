name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18', '20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: wrapper stays transparent for fast commands
        run: |
          out=$(node bin/downtime run echo hello)
          test "$out" = "hello" || { echo "expected hello, got '$out'"; exit 1; }
      - name: exit codes are propagated
        run: |
          node bin/downtime run sh -c 'exit 42' && code=0 || code=$?
          test "$code" = "42" || { echo "expected 42, got $code"; exit 1; }
